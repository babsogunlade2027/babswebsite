backend:
  name: github
  repo: babsogunlade2027/babswebsite
  branch: main
  base_url: https://babatundeogunlade.com
  auth_endpoint: api/auth

site_url: https://babatundeogunlade.com
display_url: https://babatundeogunlade.com
logo_url: /favicon.svg
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"
publish_mode: editorial_workflow

collections:
  - name: "news"
    label: "News & Press Releases"
    label_singular: "News article"
    folder: "_posts/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "gallery"
    label: "Gallery Entries"
    label_singular: "Gallery entry"
    folder: "_posts/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Caption", name: "caption", widget: "string", required: false }
