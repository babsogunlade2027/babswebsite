name = "babswebsite-preview"
main = "worker.js"
compatibility_date = "2026-10-20"

# Production-only deployment configuration.
# Keep OAuth credentials as Cloudflare secret bindings; never place them here.
[[d1_databases]]
binding = "DB"
database_name = "babs-cms-production"
database_id = "ce86e7a4-c7d7-4630-8924-62e7b64aae73"
migrations_dir = "migrations"

[vars]
CONTENT_BRANCH = "main"
ADMIN_GITHUB_IDS = "351999827"

[triggers]
crons = ["* * * * *"]
