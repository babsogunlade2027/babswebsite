name = "babswebsite-preview"
main = "worker.js"
compatibility_date = "2026-10-20"

# OAuth credentials remain managed as Cloudflare Worker secret bindings.
# Preserve the existing GITHUB_OAUTH_CLIENT_ID and GITHUB_OAUTH_CLIENT_SECRET bindings.

[[d1_databases]]
binding = "DB"
database_name = "babs-cms-production"
database_id = "ce86e7a4-c7d7-4630-8924-62e7b64aae73"
migrations_dir = "migrations"

[vars]
CONTENT_BRANCH = "cms/phase-one-audit-and-foundation"
ADMIN_GITHUB_IDS = "351999827"

[triggers]
crons = ["* * * * *"]
